name: Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and publish (must not have an APK asset yet)
        required: true
        default: v1.1.2
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify release tag matches app version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\"' | head -n 1)"
          app_version="${version%%+*}"
          tag_version="${RELEASE_TAG#v}"
          if [[ -z "$app_version" || "$app_version" != "$tag_version" ]]; then
            echo "Release tag does not match the version in pubspec.yaml." >&2
            exit 1
          fi
          # The generated in-app version must match the tag as well.
          python3 tool/sync_app_version.py --check

      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release view "$RELEASE_TAG" >/dev/null

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pin the exact Flutter used to verify this build; floating stable
          # silently broke CI when Flutter raised its minimum AGP.
          flutter-version: '3.50.1'
          cache: true

      - name: Resolve Flutter release dependencies
        # integration_test is a dev-only Flutter SDK plugin and must not enter the release registrant.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pubspec = Path("pubspec.yaml")
          lines = pubspec.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line == "  integration_test:\n"]
          if len(matches) != 1 or lines[matches[0] + 1] != "    sdk: flutter\n":
              raise SystemExit("Could not locate the integration_test dev dependency exactly once.")
          del lines[matches[0]:matches[0] + 2]
          pubspec.write_text("".join(lines))
          PY
          flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.3.1

      - name: Point Gradle at the Flutter and Android SDKs
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_root" "$android_sdk" > android/local.properties

      - name: Restore and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASS" || \
                -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASS" ]]; then
            echo "Required Android signing secrets are missing." >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/android-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list -keystore "$keystore_path" -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASS -alias "$ANDROID_KEY_ALIAS" >/dev/null
          printf 'ANDROID_KEYSTORE=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed production APK
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/android-release.p12
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: flutter build apk --release --no-pub

      - name: Verify APK signature and prepare release assets
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/android-release.p12
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk_path"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk_path" >/dev/null

          apksigner_output="$("$apksigner" verify --print-certs "$apk_path" 2>&1)"
          apk_fingerprint="$(printf '%s' "$apksigner_output" | \
            grep -Eo '[[:xdigit:]]{64}' | head -n 1 | tr '[:lower:]' '[:upper:]' || true)"
          keystore_fingerprint="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE" \
            -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASS \
            -alias "$ANDROID_KEY_ALIAS" | openssl dgst -sha256 | \
            awk '{print $NF}' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$apk_fingerprint" || "$apk_fingerprint" != "$keystore_fingerprint" ]]; then
            echo "::error title=Certificate fingerprint mismatch::APK=${apk_fingerprint:-missing}; keystore=${keystore_fingerprint:-missing}"
            echo "APK signer does not match the configured release keystore." >&2
            exit 1
          fi

          # Read the version back from the built APK: gradle derives it from
          # pubspec.yaml, and this asserts the artifact really carries it.
          aapt2="$(find "$sdk_root/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$aapt2"
          badging="$("$aapt2" dump badging "$apk_path")"
          apk_version_name="$(printf '%s' "$badging" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\2/p")"
          apk_version_code="$(printf '%s' "$badging" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1/p")"
          expected_version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\"' | head -n 1)"
          expected_name="${expected_version%%+*}"
          expected_code="${expected_version##*+}"
          if [[ "$apk_version_name" != "$expected_name" || "$apk_version_code" != "$expected_code" ]]; then
            echo "::error title=APK version mismatch::APK=${apk_version_name:-?}(${apk_version_code:-?}); pubspec=${expected_name}(${expected_code})"
            exit 1
          fi
          echo "APK version verified: ${apk_version_name}+${apk_version_code}"

          asset="Sanjab-${RELEASE_TAG}.apk"
          cp "$apk_path" "$asset"
          sha256sum "$asset" > "${asset}.sha256"

      - name: Refuse to overwrite an already published artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for name in "Sanjab-${RELEASE_TAG}.apk" "Sanjab-${RELEASE_TAG}.apk.sha256"; do
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "::error title=Release asset already published::$name already exists on $RELEASE_TAG."
              echo "Published artifacts are immutable. Delete the old asset or cut a new tag deliberately." >&2
              exit 1
            fi
          done

      - name: Upload signed APK and checksum to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "Sanjab-${RELEASE_TAG}.apk" "Sanjab-${RELEASE_TAG}.apk.sha256"
