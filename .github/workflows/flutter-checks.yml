name: Flutter checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        id: dependencies
        run: flutter pub get

      - name: Set up Gradle
        if: ${{ steps.dependencies.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Generate ignored Gradle wrapper files
        if: ${{ steps.dependencies.outcome == 'success' }}
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_root" "$android_sdk" > android/local.properties
          gradle -p android wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Analyze Dart code
        id: analyze
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        id: tests
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: flutter test --no-pub

      - name: Build Android debug APK
        id: build
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: flutter build apk --debug --no-pub

      - name: Fail if any verification step failed
        if: ${{ always() }}
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'Dependencies: %s\nAnalyze: %s\nTests: %s\nDebug APK: %s\n' \
            "$DEPENDENCIES" "$ANALYZE" "$TESTS" "$BUILD"
          test "$DEPENDENCIES" = success && test "$ANALYZE" = success && \
            test "$TESTS" = success && test "$BUILD" = success
