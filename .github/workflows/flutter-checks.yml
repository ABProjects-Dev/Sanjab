name: Flutter checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per event source: a branch push and its pull_request run have the
  # same ref name, and sharing a group made them cancel each other.
  group: flutter-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Keep in sync with pubspec.yaml / android/settings.gradle.kts.
  FLUTTER_VERSION: '3.50.1'

jobs:
  test:
    name: Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the in-app version matches pubspec.yaml
        run: python3 tool/sync_app_version.py --check

      # Gradle runs even for `flutter test` (it configures the Android plugins of
      # the app), so the JDK must exist before Flutter is set up.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pin the exact Flutter used to verify this build; floating stable
          # silently broke CI when Flutter raised its minimum AGP.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests with coverage
        shell: bash
        run: |
          set +e
          report_file="$RUNNER_TEMP/flutter-test-report.jsonl"
          # Serial: several suites bind a TCP port on the host, so running test
          # files in parallel lets them race for it and flake the run.
          flutter test --no-pub --coverage --concurrency=1 --reporter=github \
            --file-reporter="json:$report_file" > test-failures.log 2>&1
          test_status=$?
          cat test-failures.log
          python3 - "$report_file" "$test_status" <<'PY'
          import json
          import sys

          report_path, status = sys.argv[1], int(sys.argv[2])
          test_names = {}
          errors = {}
          failures = []
          try:
              with open(report_path, encoding="utf-8") as report:
                  for line in report:
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if not isinstance(event, dict):
                          continue
                      kind = event.get("type", event.get("event"))
                      params = event.get("params")
                      if not isinstance(params, dict):
                          params = event
                      if kind == "testStart":
                          test = params.get("test")
                          if isinstance(test, dict):
                              test_id = str(test.get("id", ""))
                              test_names[test_id] = " ".join(
                                  str(part) for part in (test.get("url"), test.get("name")) if part
                              )
                      elif kind == "error":
                          test_id = str(params.get("testID", ""))
                          errors[test_id] = "\n".join(
                              part for part in (str(params.get("error", "")), str(params.get("stackTrace", ""))) if part
                          )
                      elif kind == "testDone" and params.get("result") in ("failure", "error"):
                          failures.append(str(params.get("testID", "")))
          except Exception as error:
              print(f"::warning title=Flutter report parser::{error}")

          if not failures and errors:
              failures.extend(errors)
          if status and failures:
              for test_id in failures:
                  name = test_names.get(test_id, f"test id {test_id}")
                  detail = errors.get(test_id, "").splitlines()[:6]
                  message = f"{name}: {' | '.join(detail)}" if detail else name
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Flutter test failed::{message}")
          elif status:
              print("::error title=Flutter tests failed::See the Flutter test output above.")
          PY
          exit "$test_status"

      - name: Show failing test output
        if: ${{ failure() && hashFiles('test-failures.log') != '' }}
        shell: bash
        run: |
          # stdout is not retrievable in some environments; lift the failing test
          # output into annotations so the reason is visible on the PR.
          python3 - test-failures.log <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          lines = text.splitlines()
          interesting = [
              index
              for index, line in enumerate(lines)
              if line.startswith(("EXCEPTION CAUGHT", "The following", "Test failed", "TimeoutException"))
              or "was thrown" in line
          ]
          for index in interesting[:12]:
              block = " | ".join(lines[index:index + 4])[:900]
              message = block.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Flutter test detail::{message}")
          PY

      - name: Summarize line coverage
        if: ${{ always() && hashFiles('coverage/lcov.info') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          found = hit = 0
          for line in Path("coverage/lcov.info").read_text(encoding="utf-8").splitlines():
              if line.startswith("LF:"):
                  found += int(line[3:])
              elif line.startswith("LH:"):
                  hit += int(line[3:])
          if found:
              percent = hit / found * 100
              print(f"Line coverage: {hit}/{found} ({percent:.1f}%)")
              print(f"::notice title=Coverage::Line coverage {percent:.1f}% ({hit}/{found} lines)")
          else:
              print("::warning title=Coverage::lcov.info contains no line data.")
          PY

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanjab-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Analyze and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pin the exact Flutter used to verify this build; floating stable
          # silently broke CI when Flutter raised its minimum AGP.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Flutter dependencies
        id: dependencies
        run: flutter pub get

      - name: Set up Gradle caches
        if: ${{ steps.dependencies.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Point Gradle at the Flutter and Android SDKs
        if: ${{ steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "flutter_root=$flutter_root"
          echo "android_sdk=${android_sdk:-<unset>}"
          test -n "$android_sdk"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_root" "$android_sdk" > android/local.properties

      - name: Analyze Dart code
        id: analyze
        if: ${{ steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/flutter-analyze.log"
          # Info-level diagnostics stay visible in the log/annotations but do
          # not gate the build. Flutter 3.50.x marks package:flutter/material.dart
          # deprecated repo-wide (migrate to material_ui is a separate task);
          # errors and warnings remain fatal.
          flutter analyze --no-pub --no-fatal-infos > "$log_file" 2>&1
          analyze_status=$?
          cat "$log_file"
          python3 - "$log_file" "$analyze_status" <<'PY'
          import re
          import sys

          log_path, status = sys.argv[1], int(sys.argv[2])
          diagnostics = []
          with open(log_path, encoding="utf-8") as log:
              for line in log:
                  match = re.match(r"\s*(error|warning|info)\s+•", line)
                  if match:
                      diagnostics.append((match.group(1), line.strip()))
          levels = {"error": "error", "warning": "warning", "info": "notice"}
          for severity, diagnostic in diagnostics:
              message = diagnostic.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              level = levels[severity]
              print(f"::{level} title=Dart analysis::{message}")
          if status and not diagnostics:
              print("::error title=Dart analysis failed::See the analyzer output above.")
          PY
          exit "$analyze_status"

      - name: Build Android debug APK
        id: build
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/flutter-build.log"
          flutter build apk --debug --no-pub > "$log_file" 2>&1
          build_status=$?
          tail -n 120 "$log_file"
          if [ "$build_status" -ne 0 ]; then
            # Job logs are not always retrievable from outside, so surface the
            # failure inline instead of pointing at a missing log.
            python3 - "$log_file" <<'PY'
          import sys

          lines = [line.rstrip() for line in open(sys.argv[1], encoding="utf-8", errors="replace")]
          interesting = [
              line
              for line in lines
              if line.startswith(("FAILURE:", "What went wrong", "Caused by", "* ", "e: ", "error:", "> "))
              or "error:" in line.lower()
              or "failed" in line.lower()
          ]
          for line in interesting[:20]:
              message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
              print(f"::error title=Android build::{message}")
          PY
          fi
          exit "$build_status"

      - name: Upload debug APK artifact
        id: artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanjab-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  release-gate:
    name: Release build gate (R8 + emulator smoke test)
    needs: test
    # The slow path runs on any push, so no change can merge without a release
    # build having passed on its branch, and on manual dispatch. Pull requests
    # reuse the run that the branch push already produced.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Flutter dependencies for the release build
        # integration_test is a dev-only Flutter SDK plugin; leaving it in makes
        # the release registrant reference native code that is not shipped.
        # The same removal happens in the publishing workflow.
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("pubspec.yaml")
          lines = pubspec.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line == "  integration_test:\n"]
          if len(matches) != 1 or lines[matches[0] + 1] != "    sdk: flutter\n":
              raise SystemExit("Could not locate the integration_test dev dependency exactly once.")
          del lines[matches[0]:matches[0] + 2]
          pubspec.write_text("".join(lines))
          PY
          flutter pub get

      - name: Set up Gradle caches
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Point Gradle at the Flutter and Android SDKs
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_root" "$android_sdk" > android/local.properties

      - name: Build release APK with a throwaway CI keystore
        # Exercises R8 minification, resource shrinking and the release signing
        # path exactly as the publishing workflow does, but with an ephemeral
        # key so no repository secret is needed. The artifact is never uploaded
        # as a release.
        shell: bash
        env:
          CI_KEYSTORE_PASS: ci-gate-only-password
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/ci-gate.p12"
          keytool -genkeypair -v -keystore "$keystore" -storetype PKCS12 \
            -alias ci-gate -storepass:env CI_KEYSTORE_PASS \
            -keypass:env CI_KEYSTORE_PASS -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Sanjab CI gate" >/dev/null
          chmod 600 "$keystore"
          export ANDROID_KEYSTORE="$keystore"
          export ANDROID_KEYSTORE_PASS="$CI_KEYSTORE_PASS"
          export ANDROID_KEY_ALIAS="ci-gate"
          export ANDROID_KEY_PASS="$CI_KEYSTORE_PASS"
          log_file="$RUNNER_TEMP/release-build.log"
          if ! flutter build apk --release --no-pub > "$log_file" 2>&1; then
            tail -n 120 "$log_file"
            grep -nE "^(e: |FAILURE|\* What went wrong|Caused by|> )" "$log_file" \
              | head -n 15 \
              | while IFS= read -r line; do
                  echo "::error title=Release build::${line//'%'/'%25'}"
                done
            exit 1
          fi
          tail -n 20 "$log_file"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"

      - name: Report APK size and version
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt2="$(find "$sdk_root/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$aapt2" dump badging "$apk" | grep -E "^(package|application-label)" || true
          python3 - "$apk" <<'PY'
          import os
          import sys
          size = os.path.getsize(sys.argv[1])
          print(f"::notice title=Release APK::{size / 1024 / 1024:.1f} MiB ({size} bytes)")
          PY

      - name: Enable KVM for the emulator
        # Without /dev/kvm the x86_64 emulator falls back to full emulation and
        # routinely misses the boot deadline on shared runners.
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          kvm-ok || echo "::warning title=KVM::not available; the emulator will be slower"

      - name: Smoke test the release APK on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # Cold-boot headless with software rendering is the reliable recipe on
          # hosted runners; snapshots and audio only add boot-time variance.
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell am start -W -n com.sanjab.game/.MainActivity
            sleep 8
            adb shell pidof com.sanjab.game || (adb logcat -d -t 300; exit 1)
