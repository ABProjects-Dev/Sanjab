name: Flutter checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter=github

  android:
    name: Analyze and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        id: dependencies
        run: flutter pub get

      - name: Set up Gradle
        if: ${{ steps.dependencies.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.3.1'

      - name: Generate ignored Gradle wrapper files
        if: ${{ steps.dependencies.outcome == 'success' }}
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_root" "$android_sdk" > android/local.properties
          gradle -p android wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Analyze Dart code
        id: analyze
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build Android debug APK
        id: build
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK artifact
        id: artifact
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sanjab-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Fail if analysis or build failed
        if: ${{ always() }}
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
        run: |
          printf 'Dependencies: %s\nAnalyze: %s\nDebug APK: %s\nArtifact: %s\n' \
            "$DEPENDENCIES" "$ANALYZE" "$BUILD" "$ARTIFACT"
          test "$DEPENDENCIES" = success && test "$ANALYZE" = success && \
            test "$BUILD" = success && test "$ARTIFACT" = success
