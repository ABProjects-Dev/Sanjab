name: Flutter checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        id: dependencies
        run: flutter pub get

      - name: Set up Gradle
        if: ${{ steps.dependencies.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.3.1'

      - name: Generate ignored Gradle wrapper files
        if: ${{ steps.dependencies.outcome == 'success' }}
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_root" "$android_sdk" > android/local.properties
          gradle -p android wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Analyze Dart code
        id: analyze
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        id: tests
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          log_file="$RUNNER_TEMP/flutter-test-events.jsonl"
          flutter test --no-pub --reporter=json > "$log_file" 2>&1
          test_status=$?
          cat "$log_file"
          python3 - "$log_file" "$test_status" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          test_status = int(sys.argv[2])
          names = {}
          errors = {}
          failures = []
          for line in open(path, encoding="utf-8"):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              kind = event.get("event", event.get("type"))
              params = event.get("params")
              if params is None:
                  for event_name in ("testStart", "error", "testDone"):
                      if event_name in event:
                          kind = event_name
                          params = event[event_name]
                          break
              if params is None:
                  params = event
              if kind == "testStart":
                  test = params.get("test", params)
                  test_id = str(test.get("id", params.get("testID", "")))
                  names[test_id] = f"{test.get('url', '')} {test.get('name', '')}".strip()
              elif kind == "error":
                  test_id = str(params.get("testID", params.get("id", "")))
                  errors[test_id] = params.get("error", "")
              elif kind == "testDone" and params.get("result") in ("failure", "error"):
                  test_id = str(params.get("testID", params.get("id", "")))
                  failures.append(test_id)

          if not failures and errors:
              failures.extend(errors)
          for test_id in failures:
              name = names.get(test_id, f"test id {test_id}")
              detail = errors.get(test_id, "").splitlines()
              message = f"{name}: {detail[0]}" if detail else name
              print(f"::error title=Flutter test failed::{message}")
          if not failures and test_status != 0:
              print("::error title=Flutter tests failed::See the test reporter output above.")
          PY
          exit "$test_status"

      - name: Upload Flutter test report
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: flutter-test-events
          path: ${{ runner.temp }}/flutter-test-events.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Android debug APK
        id: build
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK artifact
        id: artifact
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sanjab-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Fail if any verification step failed
        if: ${{ always() }}
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
        run: |
          printf 'Dependencies: %s\nAnalyze: %s\nTests: %s\nDebug APK: %s\nArtifact: %s\n' \
            "$DEPENDENCIES" "$ANALYZE" "$TESTS" "$BUILD" "$ARTIFACT"
          test "$DEPENDENCIES" = success && test "$ANALYZE" = success && \
            test "$TESTS" = success && test "$BUILD" = success && \
            test "$ARTIFACT" = success
