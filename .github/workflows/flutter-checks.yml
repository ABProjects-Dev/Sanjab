name: Flutter checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        shell: bash
        run: |
          set +e
          report_file="$RUNNER_TEMP/flutter-test-report.jsonl"
          flutter test --no-pub --concurrency=2 --reporter=github --file-reporter="json:$report_file"
          test_status=$?
          python3 - "$report_file" "$test_status" <<'PY'
          import json
          import sys

          report_path, status = sys.argv[1], int(sys.argv[2])
          test_names = {}
          errors = {}
          failures = []
          try:
              with open(report_path, encoding="utf-8") as report:
                  for line in report:
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if not isinstance(event, dict):
                          continue
                      kind = event.get("type", event.get("event"))
                      params = event.get("params")
                      if not isinstance(params, dict):
                          params = event
                      if kind == "testStart":
                          test = params.get("test")
                          if isinstance(test, dict):
                              test_id = str(test.get("id", ""))
                              test_names[test_id] = " ".join(
                                  str(part) for part in (test.get("url"), test.get("name")) if part
                              )
                      elif kind == "error":
                          test_id = str(params.get("testID", ""))
                          errors[test_id] = "\n".join(
                              part for part in (str(params.get("error", "")), str(params.get("stackTrace", ""))) if part
                          )
                      elif kind == "testDone" and params.get("result") in ("failure", "error"):
                          failures.append(str(params.get("testID", "")))
          except Exception as error:
              print(f"::warning title=Flutter report parser::{error}")

          if not failures and errors:
              failures.extend(errors)
          if status and failures:
              for test_id in failures:
                  name = test_names.get(test_id, f"test id {test_id}")
                  detail = errors.get(test_id, "").splitlines()[:6]
                  message = f"{name}: {' | '.join(detail)}" if detail else name
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Flutter test failed::{message}")
          elif status:
              print("::error title=Flutter tests failed::See the Flutter test output above.")
          PY
          exit "$test_status"

  android:
    name: Analyze and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        id: dependencies
        run: flutter pub get

      - name: Set up Gradle
        if: ${{ steps.dependencies.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.3.1'

      - name: Generate ignored Gradle wrapper files
        if: ${{ steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "flutter_root=$flutter_root"
          echo "android_sdk=${android_sdk:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          command -v gradle || echo "gradle not on PATH"
          test -n "$android_sdk"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_root" "$android_sdk" > android/local.properties
          if ! gradle -p android wrapper --gradle-version 9.3.1 --distribution-type all 2>&1 | tee "$RUNNER_TEMP/gradle-wrapper.log"; then
            status=${PIPESTATUS[0]}
            { grep -iE "what went wrong|execution failed|failed|exception|caused by|unable to|not found|could not|error" "$RUNNER_TEMP/gradle-wrapper.log" | tail -8; echo '--- tail of log ---'; tail -c 1500 "$RUNNER_TEMP/gradle-wrapper.log"; } | tr -d '\r' | while IFS= read -r line; do
              esc=${line//%/%25}
              printf '::error title=Gradle wrapper::%s\n' "$esc"
            done
            exit "$status"
          fi

      - name: Analyze Dart code
        id: analyze
        if: ${{ steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/flutter-analyze.log"
          flutter analyze --no-pub > "$log_file" 2>&1
          analyze_status=$?
          cat "$log_file"
          python3 - "$log_file" "$analyze_status" <<'PY'
          import re
          import sys

          log_path, status = sys.argv[1], int(sys.argv[2])
          diagnostics = []
          with open(log_path, encoding="utf-8") as log:
              for line in log:
                  match = re.match(r"\s*(error|warning|info)\s+•", line)
                  if match:
                      diagnostics.append((match.group(1), line.strip()))
          levels = {"error": "error", "warning": "warning", "info": "notice"}
          for severity, diagnostic in diagnostics:
              message = diagnostic.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              level = levels[severity]
              print(f"::{level} title=Dart analysis::{message}")
          if status and not diagnostics:
              print("::error title=Dart analysis failed::See the analyzer output above.")
          PY
          exit "$analyze_status"

      - name: Build Android debug APK
        id: build
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK artifact
        id: artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sanjab-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1
