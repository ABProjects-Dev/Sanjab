name: sanjab
description: "سنجاب — Persian category word game (Android, local-network multiplayer)"
publish_to: 'none'

# Single source of truth for the app version (see tool/sync_app_version.py).
version: 1.1.2+11

environment:
  sdk: ^3.13.7

dependencies:
  characters: ^1.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Local storage for the temporary game state (no network needed).
  path_provider: ^2.1.4
  # Renders the join QR code on the host device.
  qr_flutter: ^4.1.0
  # Scans the host QR code with the camera when joining.
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon_display.png

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn_regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn_semibold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn_bold.ttf
          weight: 700
