name: sanjab
description: "سنجاب — Persian category word game (Android, local-network multiplayer)"
publish_to: 'none'

# نسخهٔ ۱.۱.۱ — VersionCode: 10
version: 1.1.1+10

environment:
  sdk: ^3.13.7

dependencies:
  characters: ^1.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # مسیر ذخیره‌سازی موقت وضعیت بازی (بدون نیاز به شبکه)
  path_provider: ^2.1.4
  # تولید QR Code برای اتصال به میزبان (صفحهٔ ایجاد بازی)
  qr_flutter: ^4.1.0
  # اسکن QR Role با دوربین (صفحهٔ پیوستن به بازی)
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon_display.png

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn_regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn_semibold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn_bold.ttf
          weight: 700
