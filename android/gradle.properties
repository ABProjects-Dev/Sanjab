# Release builds run R8 minify + resource shrinking; they need enough heap.
# The release workflow builds on GitHub Actions runners (several GB of RAM).
# If you build locally on a low-memory machine and hit OOM, lower -Xmx or
# build through CI instead of disabling minification.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=4
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
